<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thirteen Colonies — one at a time</title>
<style>
  :root{
    --paper:#F4F6F7;
    --ink:#182028;
    --ink-soft:#5A666F;
    --land:#C3C9CE;
    --land-line:#3D4750;
    --hi:#17A2B8;
    --hi-line:#0A6472;
    --ne:#D98C2B;
    --mid:#17A2B8;
    --south:#7565AD;
    --rail:#FFFFFF;
    --edge:#D5DADE;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
    font-size:16px; line-height:1.45;
  }
  .shell{display:flex; height:100vh; min-height:0}
  .stage{flex:1 1 auto; min-width:0; display:flex; align-items:center; justify-content:center; padding:8px}
  svg.map{width:100%; height:100%; max-height:100vh; display:block; touch-action:manipulation}

  .land{fill:var(--land); stroke:var(--land-line); stroke-width:1.1; stroke-linejoin:round; cursor:pointer;
        transition:fill .16s ease}
  .land:hover{fill:#AEB6BC}
  .land.on{fill:var(--hi); stroke:var(--hi-line); stroke-width:1.6}
  .land.on:hover{fill:var(--hi)}
  svg.regions .land.ne.on{fill:var(--ne); stroke:#8A5310}
  svg.regions .land.mid.on{fill:var(--mid); stroke:var(--hi-line)}
  svg.regions .land.south.on{fill:var(--south); stroke:#4A3C7A}
  .land:focus{outline:none}
  .land:focus-visible{stroke:#101820; stroke-width:2.6}
  .mfill{fill:#E7EAEC; stroke:#939DA5; stroke-width:1.2; stroke-dasharray:5 3.5;
         stroke-linejoin:round; pointer-events:none}
  .mline{fill:none; stroke:#3E4952; stroke-width:1.2; stroke-dasharray:5 3.5;
         stroke-linejoin:round; pointer-events:none}

  text{font-family:inherit; fill:var(--ink); paint-order:stroke; stroke:#F4F6F7; stroke-width:2.2;
       stroke-linejoin:round; pointer-events:none}
  .lab{font-size:15px; font-weight:600; text-anchor:middle; dominant-baseline:middle}
  .lab.tiny{font-size:13.5px}
  .lab.faint{font-size:12.5px; font-weight:500; fill:#7A848C}
  .leader{stroke:#4A5259; stroke-width:1; fill:none}
  .cap-name{font-size:40px; font-weight:700; letter-spacing:-.5px}
  .cap-meta{font-size:16px; fill:var(--ink-soft); stroke-width:2}
  .cap-note{font-size:14.5px; fill:var(--ink-soft); stroke-width:2}
  .cap-mode{font-size:13px; font-weight:700; fill:var(--hi-line); stroke-width:2}
  .hidden{display:none}

  .rail{flex:0 0 268px; background:var(--rail); border-left:1px solid var(--edge);
        display:flex; flex-direction:column; overflow-y:auto}
  .rail header{padding:18px 18px 12px}
  .rail h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.2px}
  .rail p.sub{margin:3px 0 0; font-size:13px; color:var(--ink-soft)}
  .controls{display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 14px; border-bottom:1px solid var(--edge)}
  button{font:inherit; font-size:13px; padding:6px 11px; border-radius:6px; border:1px solid var(--edge);
         background:#fff; color:var(--ink); cursor:pointer}
  button:hover{background:#F0F3F4}
  button.act{background:var(--ink); color:#fff; border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--hi); outline-offset:2px}

  .group{padding:12px 12px 4px}
  .group h2{margin:0 0 6px 6px; font-size:12.5px; font-weight:700; color:var(--ink-soft)}
  .group h2 .dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:6px}
  .list{display:flex; flex-direction:column; gap:2px}
  .item{display:flex; justify-content:space-between; align-items:baseline; gap:8px; width:100%;
        text-align:left; padding:7px 10px; border:1px solid transparent; border-radius:6px; background:none; font-size:14.5px}
  .item:hover{background:#F0F3F4}
  .item .yr{font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .item[aria-pressed="true"]{background:var(--ink); color:#fff}
  .item[aria-pressed="true"] .yr{color:#B9C3C9}
  .note{padding:12px 18px 22px; font-size:12.5px; line-height:1.5; color:var(--ink-soft); border-top:1px solid var(--edge)}
  .note b{color:var(--ink); font-weight:600}

  @media (max-width:820px){
    .shell{flex-direction:column; height:auto}
    .stage{padding:4px; height:66vh}
    .rail{flex:1 1 auto; border-left:none; border-top:1px solid var(--edge)}
  }
  @media print{ .rail{display:none} .stage{height:100vh} }
  @media (prefers-reduced-motion:reduce){ .land{transition:none} }
</style>
</head>

        <text class="cap-note" id="capNote3" y="100"></text>
        <text class="cap-note" id="capNote4" y="120"></text>
      </g>
    </svg>
  </div>

  <div class="rail">
    <header>

      <button id="btnSave">Save image</button>

    <div id="groups"></div>
    <div class="note" id="note"></div>
  </div>
</div>

  'Maine is part of <b>Massachusetts</b> (it was, until 1820), and the New Hampshire Grants — ' +
  'later Vermont — sit inside <b>New York</b>, which held them east to the Connecticut River ' +
  'after the Crown ruled for it in 1764. <b>Show modern borders</b> lays the state lines of ' +
  'today over the top, with the land the states took in later shown pale. Founding dates are ' +
  'the ones textbooks use; several colonies changed hands or charters more than once.';
const shapes = document.getElementById('shapes');
const modernG = document.getElementById('modern');
const modernFillG = document.getElementById('modernFill');
const leaders = document.getElementById('leaders');
const labels = document.getElementById('labels');
const svg = document.getElementById('map');
let selected = null, regionMode = false, showLabels = true, showModern = false;

// the modern states: pale bodies under the colonies, dashed lines over them
MODERN.forEach(d => {
  const under = document.createElementNS(svg.namespaceURI,'path');
  under.setAttribute('d', d); under.setAttribute('class','mfill');
  modernFillG.appendChild(under);
  const over = document.createElementNS(svg.namespaceURI,'path');
  over.setAttribute('d', d); over.setAttribute('class','mline');
  modernG.appendChild(over);
});

DATA.colonies.forEach((c, i) => {
  const p = document.createElementNS(svg.namespaceURI,'path');
  p.setAttribute('d', c.d);
  p.setAttribute('class', 'land ' + REGIONS[c.region]);
  p.setAttribute('tabindex','0');
  p.setAttribute('role','button');
  p.setAttribute('aria-label', c.id);
  p.dataset.id = c.id;
  p.addEventListener('click', () => pick(c.id));
  p.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(c.id);} });
  shapes.appendChild(p);
  c.el = p;

  if (c.lead) {
    const l = document.createElementNS(svg.namespaceURI,'path');
    l.setAttribute('d', 'M' + c.lead.map(pt => pt.join(',')).join(' L'));
    l.setAttribute('class','leader');
    leaders.appendChild(l);
    c.leadEl = l;
  }
  const t = document.createElementNS(svg.namespaceURI,'text');
  t.setAttribute('x', c.lab[0]); t.setAttribute('y', c.lab[1]);
  t.setAttribute('class', 'lab' + (c.ab.length <= 2 ? ' tiny' : ''));
  t.textContent = c.ab;
  labels.appendChild(t);
  c.labEl = t;
});

// standing annotations
function annotate(x, y, txt){
  const t = document.createElementNS(svg.namespaceURI,'text');
  t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('class','lab faint');
  t.textContent = txt; labels.appendChild(t); t.dataset.aux = '1';
  return t;
}
[[792.3,151.9,'Maine'],[792.9,168.3,'(part of Massachusetts)']].forEach(v => annotate(...v));
// names for the two states the modern lines carve out of the colonies
const modernLabEls = MODERN_LABELS.map(m => annotate(m.at[0], m.at[1], m.text));

const capName = document.getElementById('capName'), capMeta = document.getElementById('capMeta');
const capMode = document.getElementById('capMode'), btnModern = document.getElementById('btnModern');
document.getElementById('note').innerHTML = NOTE;
const noteLines = [1,2,3,4].map(n => document.getElementById('capNote'+n));

function wrap(text, per){
  const words = text.split(' '); const out = []; let line = '';
  for (const w of words){
    if ((line + ' ' + w).trim().length > per){ out.push(line.trim()); line = w; }
    else line += ' ' + w;
  }
  out.push(line.trim());
  return out.slice(0,4);
}

function paintModern(){
  modernG.classList.toggle('hidden', !showModern);
  modernFillG.classList.toggle('hidden', !showModern);
  modernLabEls.forEach(t => t.classList.toggle('hidden', !showModern));
  capMode.textContent = 'Colonial borders, c. 1775' + (showModern ? ' · modern state lines shown' : '');
  btnModern.textContent = showModern ? 'Hide modern borders' : 'Show modern borders';
  btnModern.classList.toggle('act', showModern);
  btnModern.setAttribute('aria-pressed', String(showModern));
  svg.setAttribute('aria-label', 'Map of the Thirteen Colonies with colonial borders of about 1775' +
    (showModern ? ', with the state lines of today drawn over them' : ''));
}

function paint(){
  svg.classList.toggle('regions', regionMode);
  DATA.colonies.forEach(c => {
    const on = regionMode || c.id === selected;
    c.el.classList.toggle('on', on);
  });
  if (regionMode){
    capName.textContent = 'Three regions';
    capMeta.textContent = 'New England · Middle · Southern';
    noteLines.forEach((n,i) => n.textContent = ['New England — orange','Middle Colonies — teal','Southern Colonies — purple',''][i]);
  } else if (selected){
    const c = DATA.colonies.find(x => x.id === selected);
    capName.textContent = c.id;
    capMeta.textContent = c.year + '  ·  ' + REGION_LABEL[c.region];
    const lines = wrap(c.note, 48);
    noteLines.forEach((n,i) => n.textContent = lines[i] || '');
  } else {
    capName.textContent = 'The Thirteen Colonies';
    capMeta.textContent = 'Choose a colony to highlight it';
    noteLines.forEach(n => n.textContent = '');
  }
  document.querySelectorAll('.item').forEach(b =>
    b.setAttribute('aria-pressed', String(!regionMode && b.dataset.id === selected)));
  document.getElementById('btnRegions').classList.toggle('act', regionMode);
}

function pick(id){ regionMode = false; selected = (selected === id ? null : id); paint(); }

// rail list
const groups = document.getElementById('groups');
Object.keys(REGIONS).forEach(reg => {
  const wrapEl = document.createElement('div'); wrapEl.className = 'group';
  const h = document.createElement('h2');
  h.innerHTML = '<span class="dot" style="background:' + REGION_HEX[reg] + '"></span>' +
                (reg === 'Middle' ? 'Middle Colonies' : reg === 'Southern' ? 'Southern Colonies' : 'New England');
  wrapEl.appendChild(h);
  const list = document.createElement('div'); list.className = 'list';
  DATA.colonies.filter(c => c.region === reg).forEach(c => {
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.id = c.id; b.setAttribute('aria-pressed','false');
    b.innerHTML = '<span>' + c.id + '</span><span class="yr">' + c.year.split(' ')[0] + '</span>';
    b.addEventListener('click', () => pick(c.id));
    list.appendChild(b);
  });
  wrapEl.appendChild(list); groups.appendChild(wrapEl);
});

document.getElementById('btnAll').addEventListener('click', () => { selected = null; regionMode = false; paint(); });
document.getElementById('btnRegions').addEventListener('click', () => { regionMode = !regionMode; selected = null; paint(); });
btnModern.addEventListener('click', () => { showModern = !showModern; paintModern(); });
const btnLabels = document.getElementById('btnLabels');
btnLabels.addEventListener('click', () => {
  showLabels = !showLabels;
  labels.classList.toggle('hidden', !showLabels);
  leaders.classList.toggle('hidden', !showLabels);
  btnLabels.textContent = showLabels ? 'Hide names' : 'Show names';
  btnLabels.classList.toggle('act', !showLabels);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const ids = DATA.colonies.map(c => c.id);
  if (e.key === 'Escape'){ selected = null; regionMode = false; paint(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    const i = ids.indexOf(selected);
    const n = e.key === 'ArrowDown' ? (i + 1) % ids.length : (i <= 0 ? ids.length - 1 : i - 1);
    regionMode = false; selected = ids[n]; paint();
  }
});

document.getElementById('btnSave').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const style = document.createElement('style');
  style.textContent = [...document.styleSheets[0].cssRules]
    .filter(r => r.selectorText && /land|lab|leader|mline|mfill|cap-|hidden|^text/.test(r.selectorText))
    .map(r => r.cssText).join('\n') +
    '\ntext{font-family:"Segoe UI",system-ui,Helvetica,Arial,sans-serif}';
  clone.insertBefore(style, clone.firstChild);
  const src = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = 1800; cv.height = 2172;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#F4F6F7'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    const a = document.createElement('a');
    a.download = ((regionMode ? 'regions' : (selected || 'thirteen-colonies')) + (showModern ? '-with-modern' : ''))
                   .replace(/\s+/g,'-').toLowerCase() + '.png';
    a.href = cv.toDataURL('image/png'); a.click();
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(src)));
});

paintModern();
paint();
</script>
</body>
</html>
